<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hot Wheels Upgrade</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f4f7;--card:#fff;--text:#16161d;--muted:#6b6b7a;--line:#e3e3ea;--green:#22b35e;--red:#e5384a;--gold:#e0a010;--accent:#ff5a1f;--pink:#e91e8c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101015;--card:#1b1b23;--text:#f2f2f6;--muted:#9a9aab;--line:#2c2c38;--gold:#f5b820}}
:root[data-theme="dark"]{--bg:#101015;--card:#1b1b23;--text:#f2f2f6;--muted:#9a9aab;--line:#2c2c38;--gold:#f5b820}
*{box-sizing:border-box}html,body{margin:0}
body{background:color-mix(in srgb,var(--accent) 7%,var(--bg));color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px;max-width:480px;margin:0 auto;min-height:100vh}
h1{font-size:19px;margin:4px 0 10px;display:flex;justify-content:space-between;align-items:center}
h1 b{color:var(--green)}
h2{font-size:13px;color:var(--muted);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.tabs{display:flex;gap:5px;margin-bottom:12px}
.tabs button{min-width:0;background:var(--card);color:var(--text);border:1px solid var(--line);padding:7px 2px;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1;border-radius:10px}
.tabs button small{font-size:10px;font-weight:600}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.car{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;font-size:11px}
.grid .car{cursor:pointer}.car.sel{border-color:var(--accent)}
.car b{display:block;font-size:12px;margin-top:2px;line-height:1.2;min-height:28px}
.car .p{color:var(--muted)}
.ci{height:72px;width:auto;max-width:100%;border-radius:4px;display:block;margin:0 auto}
.tag{font-size:9px;font-weight:700;border-radius:6px;padding:1px 5px;color:#fff;display:inline-block;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.wheelbox{position:relative;width:270px;height:270px;margin:6px auto 10px}
#wheel{width:270px;height:270px;border-radius:50%;transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
.ptr{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:22px solid var(--text);z-index:2}
.hub{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:18px;border:3px solid var(--line)}
.hub small{font-size:10px;color:var(--muted);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;margin:6px 0}
input[type=range]{width:100%;accent-color:var(--accent)}
button{font:inherit;border:0;border-radius:12px;padding:13px;width:100%;font-weight:700;font-size:16px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);font-size:13px;padding:10px;margin-top:8px}
.sell{background:var(--red);margin-top:10px;font-size:14px;padding:10px}
.buy{background:var(--green);font-size:14px;padding:10px}
.dark{background:#2b2233;color:#f3e6ff;font-size:14px;padding:10px}
.vs{display:flex;align-items:center;justify-content:space-around;gap:6px}
.vs .car{width:42%}.arrow{font-size:22px;color:var(--muted)}
#res{text-align:center;font-weight:700;min-height:44px;margin-top:10px;font-size:15px}
.gold{color:var(--gold)}.g{color:var(--green)}.r{color:var(--red)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.offer{display:flex;gap:12px;align-items:center}
.offer .car{width:96px;flex:none}.offer .info{flex:1;font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--line);margin:6px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink)}
.sec{display:none}.sec.on{display:block}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw button{background:var(--card);color:var(--text);border:2px solid var(--line);font-size:13px;padding:10px 4px;display:flex;align-items:center;justify-content:center;gap:6px}
.sw button.on{border-color:var(--accent)}
.sw i{width:16px;height:16px;border-radius:50%;display:inline-block}
.dealer{display:flex;gap:12px;align-items:center}
.dealer img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--pink)}
.dealer p{margin:0;font-size:13px;font-style:italic}
#got{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
#got.on{display:flex}
#cf{position:fixed;inset:0;width:100%;height:100%;z-index:101;pointer-events:none}
.gbox{position:relative;z-index:102;background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:320px;text-align:center}
.gbox .gt{font-size:20px;font-weight:800;margin-bottom:10px}
.gbox .car{border:0;font-size:14px}.gbox .car b{font-size:16px;min-height:0;margin:8px 0 2px}
.gbox .ci{height:240px}.gbox svg{width:150px;height:auto}
#caseov,#pick{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
#caseov.on,#pick.on{display:flex}
.cbox{width:100%;max-width:420px;background:var(--card);border-radius:20px;padding:18px;text-align:center}
.cbox .gt{font-size:18px;font-weight:800}
.cwin{position:relative;overflow:hidden;border-radius:12px;background:var(--bg);height:134px;margin-top:12px}
#cstrip{display:flex;height:100%;will-change:transform}
.ci2{flex:none;width:96px;height:100%;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;padding:4px;gap:3px;line-height:1.1}
.ci2 img{height:78px;width:auto;border-radius:3px}.ci2 svg{width:64px}
.cmark{position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--accent);z-index:2;transform:translateX(-50%);box-shadow:0 0 8px var(--accent)}
#pick .gbox .car{font-size:11px}#pick .gbox .ci{height:72px}
.tabs button{position:relative}.tabs button small{font-size:9px}
.bdg{display:none;position:absolute;top:-5px;right:4px;min-width:17px;height:17px;border-radius:9px;background:#e5384a;color:#fff;font-size:11px;font-weight:800;align-items:center;justify-content:center;border:2px solid var(--bg);line-height:1}
.gcars{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.gcars .car{border:0;font-size:14px}.gcars .car b{font-size:16px;min-height:0;margin:8px 0 2px}
.gcars.many .car{width:46%}.gcars.many .ci{height:120px}.gcars.many .car b{font-size:12px}
#dwheel{width:270px;height:270px;border-radius:50%;transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
#dpanel .vs .car{font-size:11px}#dpanel .vs .car b{font-size:12px}
</style>
</head>
<body>
<h1>🏁 Hot Wheels <b id="bal"></b></h1>
<div class="tabs" id="tabs">
<button data-t="w" class="on">🎡<small data-i="tab_w"></small></button><button data-t="d">⚔️<small data-i="tab_d"></small></button><button data-t="s">🛒<small data-i="tab_s"></small></button><button data-t="q">🎯<small data-i="tab_q"></small></button><button data-t="m">🕶<span class="bdg" id="bdg">!</span><small data-i="tab_m"></small></button><button data-t="p">👤<small data-i="tab_p"></small></button><button data-t="x">⚙️<small data-i="tab_x"></small></button></div>

<div class="sec on" id="sec-w">
  <div class="card">
    <div class="vs"><div class="car" id="from"></div><div class="arrow">➜</div><div class="car" id="to"></div></div>
    <div class="row" style="margin-top:12px"><span><span data-i="prize"></span>: <b id="mult"></b></span><span><span data-i="gchance"></span>: <b id="chance" class="g"></b></span></div>
    <div class="row" style="margin:2px 0"><span style="font-size:12px;color:var(--muted)" data-i="safer"></span><span style="font-size:12px;color:var(--muted)" data-i="riskier"></span></div>
    <input type="range" id="slider" min="5" max="95" value="40">
    <div class="note" id="bnote"></div>
    <div class="note" id="goldnote"></div>
    <div class="wheelbox"><div class="ptr"></div><canvas id="wheel" width="540" height="540"></canvas><div class="hub"><span id="hubv">—</span><small data-i="red"></small></div></div>
    <button id="spin" data-i="spin"></button>
    <div id="res"></div>
  </div>
  <h2><span data-i="coll"></span> <span id="count" style="text-transform:none"></span></h2>
  <div class="note" style="margin:-4px 0 8px;text-align:left" data-i="multi_hint"></div>
  <div class="grid" id="inv"></div>
  <button class="sell" id="sell" style="display:none"></button>
</div>

<div class="sec" id="sec-d">
  <div class="card"><div class="note" style="margin:0 0 10px;text-align:left" data-i="duel_rules"></div><div class="sw" id="bots"></div></div>
  <div class="card" id="dpanel"></div>
  <h2><span data-i="coll"></span></h2>
  <div class="note" style="margin:-4px 0 8px;text-align:left" data-i="multi_hint"></div>
  <div class="grid" id="dinv"></div>
</div>

<div class="sec" id="sec-s">
  <div class="card"><div class="row"><span data-i="you_have"></span><b id="bal2"></b></div><div class="note" style="margin-top:0;text-align:left" data-i="shop_note"></div></div>
  <div id="offers"></div>
  <button class="ghost" id="refresh" data-i="refresh"></button>
</div>

<div class="sec" id="sec-q">
  <div class="card note" style="text-align:left;margin-top:0" data-i="quest_note"></div>
  <div id="quests"></div>
</div>

const ALL=CARS.concat(COLLAB),BY=id=>ALL.find(c=>c.id===id);
const NORMAL=CARS.filter(c=>c.r!=="s"),STH=CARS.filter(c=>c.r==="s");
const QUESTS=[{id:1,k:"spins",n:3,car:100},{id:2,k:"wins",n:2,car:101},{id:3,k:"buys",n:2,car:102},{id:4,k:"sells",n:2,car:103},{id:5,k:"prem",n:1,car:104}];
const THEMES={fire:["Огонь","Fire","#ff5a1f"],ocean:["Океан","Ocean","#1e88e5"],lime:["Лайм","Lime","#6aa81a"],pink:["Розовый","Pink","#e91e8c"],violet:["Фиолет","Violet","#8b5cf6"],gold:["Золото","Gold","#d99a00"]};
const MODES={auto:["Авто","Auto"],light:["Светлая","Light"],dark:["Тёмная","Dark"]};
const LANGS={ru:"Русский",en:"English"};
const CURS={rub:["Рубли (₽)","Rubles (₽)"],usd:["Доллары ($)","Dollars ($)"]};
const $=id=>document.getElementById(id);
const RATE=90,MINP=100,LUCK_COST=2500,INC_COST=130,DEP_MS=60000;
const GOLD_P=.12,GOLD_SIZE=.14;
let S,sel=[],spinning=false,boxBusy=false,rot=0,drot=0,goldOn=false,curTab="w",lastReady=0;
let DU={bot:0,mine:null,opp:null,msg:""};
const en=()=>S.set.lang==="en",ix=()=>en()?1:0;
const cn=c=>!en()&&c.ru?c.ru:c.name;
function money(n){const loc=en()?"en-US":"ru-RU";
  if(S.set.cur==="usd")return "$"+(n/RATE).toLocaleString(loc,{minimumFractionDigits:2,maximumFractionDigits:2});
  return Math.round(n).toLocaleString(loc)+" ₽"}
const sellPrice=c=>Math.round(c.price*.9);
const sumP=a=>a.reduce((s,c)=>s+c.price,0);
const lvl=()=>Math.floor(Math.sqrt((S.xp||0)/40))+1;
const mk=id=>({id,pb:0});
const readyD=d=>Date.now()-d.t0>=DEP_MS;
const fmtT=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};

function norm(v){v.inv=v.inv.map(x=>typeof x==="number"?mk(x):x);v.inv.forEach(o=>{if(o.g){o.pb=(o.pb||0)+o.g.amt}delete o.g});
  if(v.xp==null)v.xp=0;if(v.luck==null)v.luck=0;if(!v.dep)v.dep=[];if(v.bonus&&!v.bonus.key)v.bonus=null;
  v.set=Object.assign({th:"fire",mode:"auto",lang:"ru",cur:"rub"},v.set||{});
  v.st=Object.assign({spins:0,wins:0,buys:0,sells:0,prem:0,gold:0,duels:0,dwins:0},v.st||{});v.cl=v.cl||{};if(!v.shop)v.shop=[];return v}
function fresh(){return norm({xp:0,bal:400,inv:[0,1],st:{},cl:{},shop:[],bonus:null,luck:0,dep:[],set:{}})}
function save(){try{localStorage.setItem("hw_state4",JSON.stringify(S))}catch(e){}}
function load(){for(const k of["hw_state4","hw_state3"]){try{const v=JSON.parse(localStorage.getItem(k));if(v&&Array.isArray(v.inv))return norm(v)}catch(e){}}return null}
const inv=()=>S.inv.map(o=>{const c=BY(o.id);return Object.assign({},c,{price:c.price+(o.pb||0)})});
const selCars=L=>sel.map(i=>L[i]).filter(Boolean);
const stakeKey=()=>sel.map(i=>S.inv[i]?S.inv[i].id:0).sort((a,b)=>a-b).join("-");

function applyTheme(){
  const r=document.documentElement;r.style.setProperty("--accent",(THEMES[S.set.th]||THEMES.fire)[2]);
  if(S.set.mode==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.set.mode);r.lang=S.set.lang;
}
function applyLang(){document.querySelectorAll("[data-i]").forEach(e=>e.innerHTML=tr(e.dataset.i))}
function svg(col,w=54,h=26){return `<svg viewBox="0 0 64 30" width="${w}" height="${h}"><path d="M4 22v-5l8-2 8-8h20l9 8 11 2v5z" fill="${col}"/><circle cx="18" cy="23" r="5" fill="#222"/><circle cx="48" cy="23" r="5" fill="#222"/><circle cx="18" cy="23" r="2" fill="#ccc"/><circle cx="48" cy="23" r="2" fill="#ccc"/></svg>`}
function cardHtml(c){return `${c.img?`<img class="ci" src="${c.img}" alt="">`:svg(R[c.r].col)}<b>${cn(c)}</b><span class="p">${money(c.price)}</span><br><span class="tag" style="background:${R[c.r].col}">${rn(c.r)}</span>`}
function stackHtml(cars){
  if(cars.length===1)return cardHtml(cars[0]);
  return `<div style="display:flex;justify-content:center;flex-wrap:wrap;gap:3px;margin-bottom:4px">${cars.slice(0,4).map(c=>c.img?`<img src="${c.img}" alt="" style="height:44px;border-radius:3px">`:svg(R[c.r].col,40,20)).join("")}</div><b style="min-height:0">${cars.length} ${tr("pcs")}</b><span class="p">${money(sumP(cars))}</span>`}

// приз выбирается ползунком и суммой ставки; бонус и удача меняют только шанс зелёного
function target(){
  const cars=selCars(inv());if(!cars.length)return null;
  const sum=sumP(cars),green=1-(+$("slider").value)/100,want=sum*.95/green,up=NORMAL.filter(x=>x.price>sum);
  return up.length?up.reduce((b,x)=>Math.abs(x.price-want)<Math.abs(b.price-want)?x:b):null;
}
function baseChance(){const cars=selCars(inv()),t=target();return cars.length&&t?Math.min(.9,.95*sumP(cars)/t.price):0}
function bonusPct(){const t=target(),b=S.bonus;return t&&b&&b.key===stakeKey()+">"+t.id?b.pct:0}
const gd=()=>goldOn?GOLD_SIZE:0;
const luckPct=()=>S.luck>0?15:0;
function totalChance(){const b=baseChance();return b?Math.min(b+(bonusPct()+luckPct())/100,.97-gd()):0}
const bonusCost=(p,t)=>Math.max(20,Math.round(p/100*t.price*1.5/10)*10);

function drawSegs(cv,segs){
  const x=cv.getContext("2d"),Sz=540,C=Sz/2,r=C-6;x.clearRect(0,0,Sz,Sz);
  for(const [a,b,col] of segs){x.beginPath();x.moveTo(C,C);x.arc(C,C,r,-Math.PI/2+a*2*Math.PI,-Math.PI/2+b*2*Math.PI);x.closePath();x.fillStyle=col;x.fill()}
  x.lineWidth=6;x.strokeStyle="rgba(128,128,140,.5)";x.beginPath();x.arc(C,C,r,0,7);x.stroke();
}
function drawWheel(){const ch=totalChance(),g=gd(),s=[[0,1,"#e5384a"]];if(ch>0)s.push([0,ch,"#22b35e"]);if(g)s.push([1-g,1,"#f5b820"]);drawSegs($("wheel"),s)}
function nextGold(){goldOn=Math.random()<GOLD_P}
function genShop(){
  const b=S.bal;let pool=NORMAL.filter(c=>c.price<=b*.8);if(!pool.length)pool=NORMAL.filter(c=>c.price<=b);
  if(!pool.length){S.shop=[];return}
  const tg=b*(.35+Math.random()*.3);pool.sort((p,q)=>Math.abs(p.price-tg)-Math.abs(q.price-tg));
  S.shop=pool.slice(0,5).sort(()=>Math.random()-.5).slice(0,3).map(c=>c.id);
}
// коробка только если нет ни машинок, ни денег хотя бы на самую дешёвую
const canBox=()=>!S.inv.length&&S.bal<MINP;

/* ===== хлопушка и окно «продать / оставить» (одна или несколько машинок) ===== */
let cfRaf=0,gotCars=[];
function boom(){
  const cv=$("cf"),x=cv.getContext("2d");cv.style.display="block";cv.width=innerWidth;cv.height=innerHeight;cancelAnimationFrame(cfRaf);
  const cols=["#ff5a1f","#f5b820","#22b35e","#3b82f6","#e91e8c","#8b5cf6","#fff"],P=[];
  for(let i=0;i<170;i++){const left=i%2===0,a=(60+Math.random()*25)*Math.PI/180,sp=15+Math.random()*16;
    P.push({x:left?0:cv.width,y:cv.height,vx:(left?1:-1)*Math.cos(a)*sp,vy:-Math.sin(a)*sp,w:6+Math.random()*7,h:4+Math.random()*6,rot:Math.random()*6,vr:(Math.random()-.5)*.5,c:cols[i%cols.length],life:0})}
  (function step(){x.clearRect(0,0,cv.width,cv.height);let alive=0;
    for(const p of P){p.vy+=.45;p.vx*=.992;p.vy*=.992;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life++;
      if(p.y<cv.height+20&&p.life<260){alive++;x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}}
    if(alive)cfRaf=requestAnimationFrame(step);else cv.style.display="none"})();
}
function closeGot(){$("got").classList.remove("on");cancelAnimationFrame(cfRaf);$("cf").style.display="none"}
function showGot(cars,title){gotCars=cars;$("gt").innerHTML=title;const g=$("gcar");g.className="gcars"+(cars.length>1?" many":"");
  g.innerHTML=cars.map(c=>`<div class="car">${cardHtml(c)}</div>`).join("");
  $("gsell").textContent=tr("got_sell",money(cars.reduce((s,c)=>s+sellPrice(c),0)));$("got").classList.add("on");boom()}
$("gok").onclick=closeGot;
$("gsell").onclick=()=>{let tot=0,n=0,last=null;
  for(const gc of gotCars){let i=-1;S.inv.forEach((o,k)=>{if(o.id===gc.id)i=k});if(i>=0){const c=inv()[i];tot+=sellPrice(c);S.inv.splice(i,1);S.st.sells++;n++;last=c}}
  if(n){S.bal+=tot;sel=[];genShop();save();$("res").innerHTML=`<span class="g">${tr("sold",n>1?n+" "+tr("pcs"):cn(last),money(tot))}</span>`;render()}closeGot()};

/* ===== коробка: ответ сохраняется сразу, анимация только показ ===== */
function openBox(){
  if(!canBox()||boxBusy)return;boxBusy=true;
  const pool=CARS.filter(c=>c.r==="c"&&c.price<=330),win=pool[Math.floor(Math.random()*pool.length)],N=42,WI=96,wi=35;
  S.inv.push(mk(win.id));S.xp+=5;save();
  const items=Array.from({length:N},(_,i)=>i===wi?win:pool[Math.floor(Math.random()*pool.length)]);
  $("cstrip").innerHTML=items.map(c=>`<div class="ci2" style="border-bottom:3px solid ${R[c.r].col}">${c.img?`<img src="${c.img}" alt="">`:svg(R[c.r].col,64,30)}<span>${cn(c)}</span></div>`).join("");
  const st=$("cstrip");st.style.transition="none";st.style.transform="translateX(0)";$("caseov").classList.add("on");void st.offsetWidth;
  const w=$("cwin").clientWidth,x=-(wi*WI+WI/2-w/2+(Math.random()-.5)*50);
  st.style.transition="transform 5s cubic-bezier(.08,.6,.12,1)";st.style.transform=`translateX(${x}px)`;
  setTimeout(()=>{$("caseov").classList.remove("on");boxBusy=false;render();showGot([win],tr("g_box"))},5500);
}

/* ===== дуэль ===== */
function genOpp(sum,bot){
  const tg=sum*(bot.lo+Math.random()*(bot.hi-bot.lo));let best=null,bd=1e12;
  for(let k=0;k<90;k++){const n=1+Math.floor(Math.random()*3),c=[];for(let i=0;i<n;i++)c.push(NORMAL[Math.floor(Math.random()*NORMAL.length)]);const d=Math.abs(sumP(c)-tg);if(d<bd){bd=d;best=c}}
  return best.map(c=>c.id);
}
const duelChance=()=>{const m=sumP(DU.mine),o=sumP(DU.opp.map(BY));return m/(m+o)};
function renderDuel(L){
  const cars=selCars(L),bot=BOTS[DU.bot];
  $("bots").innerHTML=BOTS.map((b,i)=>`<button data-bot="${i}" class="${DU.bot===i?"on":""}" ${DU.opp?"disabled":""}><img src="${b.img}" alt="" style="width:30px;height:30px;border-radius:50%;object-fit:cover">${b.n[ix()]}</button>`).join("");
  const p=$("dpanel");
  if(!DU.opp){
    p.innerHTML=(DU.msg?`<div id="dres" style="margin-bottom:10px">${DU.msg}</div>`:"")+(cars.length?`<div class="vs"><div class="car" style="width:60%">${stackHtml(cars)}</div></div><button id="dcall" style="margin-top:10px">${tr("duel_call")}</button>`:`<div class="note">${tr("duel_pick")}</div>`);
    return}
  const opp=DU.opp.map(BY),pc=duelChance();
  p.innerHTML=`<div class="vs"><div class="car"><b style="min-height:0">${tr("you")}</b>${stackHtml(DU.mine)}</div><div class="arrow">⚔️</div><div class="car"><img src="${bot.img}" alt="" style="width:34px;height:34px;border-radius:50%;object-fit:cover"><b style="min-height:0">${bot.n[ix()]}</b>${stackHtml(opp)}</div></div>
  <div class="row"><span>${tr("your_chance")}</span><b class="g">${(pc*100).toFixed(1)}%</b></div>
  <div class="wheelbox"><div class="ptr"></div><canvas id="dwheel" width="540" height="540"></canvas><div class="hub"><span>${Math.round(pc*100)}%</span><small>${tr("you")}</small></div></div>
  <button id="dspin">${tr("duel_spin")}</button><button class="ghost" id="dcancel">${tr("cancel")}</button>`;
  drawSegs($("dwheel"),[[0,1,"#e5384a"],[0,pc,"#3b82f6"]]);
}

/* ===== отрисовка ===== */
function setBadge(){$("bdg").style.display=S.dep.some(readyD)&&curTab!=="m"?"flex":"none"}
function render(){
  const L=inv();sel=sel.filter(i=>i<L.length);const cars=selCars(L);
  $("bal").textContent=tr("lv")+lvl()+" · "+money(S.bal);$("bal2").textContent=money(S.bal);
  $("count").textContent=`— ${L.length} ${tr("pcs")} · ${money(sumP(L))}`;
  const grid=L.map((c,i)=>`<div class="car ${sel.includes(i)?"sel":""}" data-i="${i}">${cardHtml(c)}</div>`).join("")||'<div class="note" style="grid-column:1/4">—</div>';
  $("inv").innerHTML=grid;$("dinv").innerHTML=grid;
  const t=cars.length?target():null;
  $("from").innerHTML=cars.length?stackHtml(cars):`<div style="padding:18px 0;color:var(--muted)">${tr("pick")}</div>`;
  $("to").innerHTML=t?cardHtml(t):`<div style="padding:18px 0;color:var(--muted)">?</div>`;
  const ch=totalChance(),bp=bonusPct(),sum=sumP(cars);
  $("mult").textContent=t?"×"+(t.price/sum).toFixed(1):"—";
  $("chance").textContent=t?(ch*100).toFixed(1)+"%":"—";
  $("hubv").textContent=t?Math.round((1-ch-gd())*100)+"%":"—";
  $("bnote").innerHTML=(bp?`<span style="color:var(--pink)">${tr("bnote",bp)}</span><br>`:"")+(S.luck>0?`<span style="color:var(--green)">${tr("lnote",S.luck)}</span>`:"");
  $("goldnote").innerHTML=goldOn?`<span class="gold">${tr("gnote",Math.round(GOLD_SIZE*100))}</span>`:"";
  $("spin").disabled=!t||spinning;
  const sb=$("sell");sb.style.display=cars.length?"block":"none";sb.disabled=spinning;
  if(cars.length)sb.textContent=cars.length===1?tr("sell_btn",cn(cars[0]),money(sellPrice(cars[0]))):tr("sell_sel",cars.length,money(cars.reduce((s,c)=>s+sellPrice(c),0)));
  drawWheel();renderDuel(L);

  const box=canBox();
  $("offers").innerHTML=(box?`<div class="card offer"><div class="car" style="border:0"><img class="ci" src="${BOXIMG}" alt=""></div><div class="info"><b>${tr("box_t")}</b><span class="note" style="display:block;text-align:left">${tr("box_d")}</span><button class="buy" data-box="1" style="margin-top:8px" ${boxBusy?"disabled":""}>${tr("open")}</button></div></div>`:"")+
  (S.shop.length?S.shop.map(id=>{const o=BY(id);return `<div class="card offer"><div class="car">${cardHtml(o)}</div><div class="info">${tr("price")}: <b>${money(o.price)}</b><span class="note" style="display:block;text-align:left">${tr("left")}: ${money(S.bal-o.price)}</span><button class="buy" data-b="${id}" style="margin-top:8px">${tr("buy")}</button></div></div>`}).join(""):(box?"":`<div class="card note">${tr("nomoney")}</div>`));

  $("quests").innerHTML=QUESTS.map(q=>{const v=Math.min(S.st[q.k]||0,q.n),done=v>=q.n,got=S.cl[q.id],car=BY(q.car);
    return `<div class="card offer"><div class="car">${cardHtml(car)}</div><div class="info"><b>${tr("q"+q.id)}</b><div class="bar"><i style="width:${v/q.n*100}%"></i></div>${v}/${q.n}<button class="buy" data-q="${q.id}" style="margin-top:8px" ${done&&!got?"":"disabled"}>${got?tr("claimed"):done?tr("claim"):tr("inprog")}</button></div></div>`}).join("");

  // чёрный рынок: машинки в работе
  lastReady=S.dep.filter(readyD).length;
  $("mk3").innerHTML=S.dep.length?`<h2>${tr("dep_t")}</h2>`+S.dep.map((d,k)=>{const c=BY(d.id),left=Math.max(0,DEP_MS-(Date.now()-d.t0)),ok=left<=0;
    return `<div class="card offer"><div class="car">${cardHtml(Object.assign({},c,{price:c.price+d.pb}))}</div><div class="info"><b style="color:${ok?"var(--green)":"var(--text)"}">${ok?tr("dep_ready"):tr("dep_wait",`<span data-tm="${k}">${fmtT(left)}</span>`)}</b><button class="buy" data-claim="${k}" style="margin-top:8px" ${ok?"":"disabled"}>${tr("dep_claim")}</button></div></div>`}).join(""):"";
  // чёрный рынок: бонус к зелёному
  if(!cars.length||!t)$("mk").innerHTML=`<div class="note">${tr("mk_first")}</div>`;
  else{const base=baseChance(),cap=40;
    $("mk").innerHTML=`<div class="row"><span>${tr("stake")}</span><b>${cars.length>1?cars.length+" "+tr("pcs")+" · "+money(sum):cn(cars[0])}</b></div><div class="row"><span>${tr("prize")}</span><b>${cn(t)} · ${money(t.price)}</b></div><div class="row"><span>${tr("base_g")}</span><b>${(base*100).toFixed(1)}%</b></div>`+
    (bp?`<div class="row"><span>${tr("bought")}</span><b style="color:var(--pink)">+${bp}%</b></div>`:"")+
    [5,10,20].map(p=>{const cost=bonusCost(p,t),off=bp+p>cap||S.bal<cost||spinning;return `<button class="dark" style="margin-top:8px" data-mk="${p}" ${off?"disabled":""}>${tr("mk_buy",p,money(cost))}</button>`}).join("")+`<div class="note">${tr("mk_note",cap)}</div>`;
  }
  $("mk2").innerHTML=(S.luck>0?`<div class="row"><b style="color:var(--green)">${tr("luck_on",S.luck)}</b></div>`:`<button class="dark" data-luck="1" ${S.bal<LUCK_COST||spinning?"disabled":""}>${tr("luck_btn",money(LUCK_COST))}</button>`)+
    `<div class="note" style="margin-bottom:14px">${tr("luck_note")}</div><button class="dark" data-inc="1" ${S.bal<INC_COST||!L.length||spinning?"disabled":""}>${tr("inc_btn",money(INC_COST))}</button><div class="note">${tr("inc_note",money(100),money(150))}</div>`;

  // профиль
  const lv=lvl(),lo=(lv-1)**2*40,hi=lv**2*40,sp=S.st.spins,wn=S.st.wins,wr=sp?(wn/sp*100).toFixed(1)+"%":"—";
  const best=L.reduce((b,x)=>!b||x.price>b.price?x:b,null);
  $("prof").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:36px">🏅</div><h2 style="margin:4px 0">${tr("level")} ${lv}</h2><div class="bar"><i style="width:${(S.xp-lo)/(hi-lo)*100}%"></i></div><div class="note" style="margin-top:0">${tr("xp_to",S.xp,hi,lv+1)}</div></div>
  <div class="card"><div class="row"><span>${tr("avgwin")}</span><b class="${sp&&wn/sp>=.5?"g":"r"}">${wr}</b></div><div class="row"><span>${tr("spins")}</span><b>${sp}</b></div><div class="row"><span>${tr("wins")}</span><b class="g">${wn}</b></div><div class="row"><span>${tr("losses")}</span><b class="r">${sp-wn}</b></div><div class="row"><span>${tr("sth")}</span><b class="gold">${S.st.gold||0}</b></div><div class="row"><span>${tr("duels")}</span><b>${S.st.dwins} / ${S.st.duels}</b></div><div class="row"><span>${tr("bs")}</span><b>${S.st.buys} / ${S.st.sells}</b></div></div>
  <div class="card"><div class="row"><span>${tr("balance")}</span><b>${money(S.bal)}</b></div><div class="row"><span>${tr("colval")}</span><b>${money(sumP(L))}</b></div><div class="row"><span>${tr("best")}</span><b style="text-align:right">${best?cn(best):"—"}</b></div></div><div class="note">${tr("xp_note")}</div>`;

  $("themes").innerHTML=Object.entries(THEMES).map(([k,v])=>`<button data-th="${k}" class="${S.set.th===k?"on":""}"><i style="background:${v[2]}"></i>${v[ix()]}</button>`).join("");
  $("modes").innerHTML=Object.entries(MODES).map(([k,v])=>`<button data-md="${k}" class="${S.set.mode===k?"on":""}">${v[ix()]}</button>`).join("");
  $("langs").innerHTML=Object.entries(LANGS).map(([k,v])=>`<button data-lg="${k}" class="${S.set.lang===k?"on":""}">${v}</button>`).join("");
  $("curs").innerHTML=Object.entries(CURS).map(([k,v])=>`<button data-cu="${k}" class="${S.set.cur===k?"on":""}">${v[ix()]}</button>`).join("");
  setBadge();
}

/* ===== события ===== */
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;curTab=b.dataset.t;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  ["w","d","s","q","m","p","x"].forEach(k=>$("sec-"+k).classList.toggle("on",k===curTab));setBadge()};
function toggleSel(e){if(spinning||boxBusy)return;if(DU.opp&&e.currentTarget.id==="dinv")return;
  const el=e.target.closest(".car");if(!el)return;const i=+el.dataset.i;sel=sel.includes(i)?sel.filter(x=>x!==i):sel.concat(i).sort((a,b)=>a-b);$("res").textContent="";if(!DU.opp)DU.msg="";render()}
$("inv").onclick=toggleSel;$("dinv").onclick=toggleSel;
$("slider").oninput=()=>{if(!spinning)render()};
$("sell").onclick=()=>{if(spinning||!sel.length)return;const L=inv(),cars=selCars(L);let tot=0;
  [...sel].sort((a,b)=>b-a).forEach(i=>{tot+=sellPrice(L[i]);S.inv.splice(i,1);S.st.sells++});S.bal+=tot;sel=[];
  $("res").innerHTML=`<span class="g">${tr("sold",cars.length>1?cars.length+" "+tr("pcs"):cn(cars[0]),money(tot))}</span>`;genShop();save();render()};
$("offers").onclick=e=>{
  if(e.target.closest("[data-box]")){openBox();return}
  const b=e.target.closest("[data-b]");if(!b)return;const c=BY(+b.dataset.b);if(S.bal<c.price)return;
  S.bal-=c.price;S.inv.push(mk(c.id));S.st.buys++;S.xp+=5;genShop();save();render();showGot([c],tr("g_buy"))};
$("refresh").onclick=()=>{genShop();save();render()};
$("quests").onclick=e=>{const b=e.target.closest("[data-q]");if(!b)return;const q=QUESTS.find(x=>x.id===+b.dataset.q);
  if(!q||S.cl[q.id]||(S.st[q.k]||0)<q.n)return;S.cl[q.id]=1;S.xp+=50;S.inv.push(mk(q.car));save();render();showGot([BY(q.car)],tr("g_quest"))};
$("mk").onclick=e=>{const b=e.target.closest("[data-mk]");if(!b||spinning)return;
  const t=target();if(!sel.length||!t)return;const p=+b.dataset.mk,cost=bonusCost(p,t),cur=bonusPct();
  if(S.bal<cost||cur+p>40)return;S.bal-=cost;S.bonus={pct:cur+p,key:stakeKey()+">"+t.id};save();render()};
$("mk2").onclick=e=>{
  if(e.target.closest("[data-luck]")){if(S.luck>0||S.bal<LUCK_COST||spinning)return;S.bal-=LUCK_COST;S.luck=3;save();render();return}
  if(e.target.closest("[data-inc]")){if(S.bal<INC_COST||spinning||!S.inv.length)return;
    $("pgrid").innerHTML=inv().map((c,i)=>`<div class="car" data-pi="${i}">${cardHtml(c)}</div>`).join("");$("pick").classList.add("on")}};
// машинка уходит на чёрный рынок на 1 минуту, потом возвращается дороже на 100–150 ₽
$("pgrid").onclick=e=>{const el=e.target.closest("[data-pi]");if(!el||S.bal<INC_COST)return;const i=+el.dataset.pi,o=S.inv[i];if(!o)return;
  S.bal-=INC_COST;S.inv.splice(i,1);S.dep.push({id:o.id,pb:o.pb||0,t0:Date.now(),amt:100+Math.floor(Math.random()*51)});sel=[];
  $("pick").classList.remove("on");save();render()};
$("pcancel").onclick=()=>$("pick").classList.remove("on");
$("mk3").onclick=e=>{const b=e.target.closest("[data-claim]");if(!b)return;const d=S.dep[+b.dataset.claim];if(!d||!readyD(d))return;
  S.dep.splice(+b.dataset.claim,1);S.inv.push({id:d.id,pb:d.pb+d.amt});save();render();
  const c=BY(d.id);showGot([Object.assign({},c,{price:c.price+d.pb+d.amt})],tr("g_dep"))};
$("themes").onclick=e=>{const b=e.target.closest("[data-th]");if(!b)return;S.set.th=b.dataset.th;applyTheme();save();render()};
$("modes").onclick=e=>{const b=e.target.closest("[data-md]");if(!b)return;S.set.mode=b.dataset.md;applyTheme();save();render()};
$("langs").onclick=e=>{const b=e.target.closest("[data-lg]");if(!b)return;S.set.lang=b.dataset.lg;applyTheme();applyLang();save();render()};
$("curs").onclick=e=>{const b=e.target.closest("[data-cu]");if(!b)return;S.set.cur=b.dataset.cu;save();render()};
$("reset").onclick=()=>{if(spinning||boxBusy)return;const st=S.set;S=fresh();S.set=st;genShop();sel=[];DU={bot:0,mine:null,opp:null,msg:""};$("res").textContent="";nextGold();save();render()};
$("bots").onclick=e=>{const b=e.target.closest("[data-bot]");if(!b||DU.opp)return;DU.bot=+b.dataset.bot;render()};
$("dpanel").onclick=e=>{
  if(e.target.closest("#dcall")){const cars=selCars(inv());if(!cars.length||spinning)return;
    DU.mine=cars.map(c=>Object.assign({},c));DU.mine.ids=cars.map(c=>c.id);DU.opp=genOpp(sumP(cars),BOTS[DU.bot]);DU.msg="";render();return}
  if(e.target.closest("#dcancel")){if(spinning)return;DU.opp=null;DU.mine=null;render();return}
  if(e.target.closest("#dspin"))duelSpin()};

function duelSpin(){
  if(spinning||!DU.opp)return;
  // находим свои машинки в коллекции; если их нет (продал или поставил на колесо) — дуэль отменяется
  const idx=[],used=new Set();
  for(const id of DU.mine.ids){const k=S.inv.findIndex((o,i)=>o.id===id&&!used.has(i));if(k<0){DU.opp=null;DU.mine=null;render();return}used.add(k);idx.push(k)}
  const bot=BOTS[DU.bot],oppCars=DU.opp.map(BY),pc=duelChance(),win=Math.random()<pc,pad=.12,j=()=>pad+Math.random()*(1-2*pad);
  const a=win?pc*j():pc+(1-pc)*j();
  const mineNames=DU.mine.map(cn).join(", "),oppNames=oppCars.map(cn).join(", ");
  spinning=true;$("dspin").disabled=true;
  // результат применяем и сохраняем сразу, анимация только показывает его
  S.st.duels++;S.xp+=10;
  if(win){S.inv.push(...oppCars.map(c=>mk(c.id)));S.st.dwins++;S.xp+=20}else idx.sort((x,y)=>y-x).forEach(i=>S.inv.splice(i,1));
  sel=[];save();
  drot+=360*5+((360-(drot%360))%360)+(360-a*360);$("dwheel").style.transform=`rotate(${drot}deg)`;
  setTimeout(()=>{spinning=false;drot=0;DU.opp=null;DU.mine=null;
    DU.msg=win?`<span class="g">${tr("d_win",bot.n[ix()],oppNames)}</span>`:`<span class="r">${tr("d_lose",bot.n[ix()],mineNames)}</span>`;
    render();if(win)showGot(oppCars.map(c=>Object.assign({},c)),tr("g_duel"))},4400);
}

$("spin").onclick=()=>{
  const L=inv(),t=target();if(!t||spinning||!sel.length)return;
  const names=selCars(L).map(cn).join(", ");
  spinning=true;$("spin").disabled=true;$("res").textContent="";
  const ch=totalChance(),g=gd(),roll=Math.random();
  const out=roll<ch?"win":(roll>=1-g?"gold":"lose"),pad=.12,j=()=>pad+Math.random()*(1-2*pad);
  const a=out==="win"?ch*j():out==="gold"?1-g+g*j():ch+(1-ch-g)*j();
  rot+=360*5+((360-(rot%360))%360)+(360-a*360);
  $("wheel").style.transform=`rotate(${rot}deg)`;
  // исход применяется и сохраняется сразу, анимация только показывает его
  [...sel].sort((x,y)=>y-x).forEach(i=>S.inv.splice(i,1));
  S.st.spins++;S.xp+=10;S.bonus=null;if(S.luck>0)S.luck--;let got=null,title="",msg="";
  if(out==="win"){S.inv.push(mk(t.id));S.st.wins++;S.xp+=25;if("pat".includes(t.r))S.st.prem++;got=t;title=tr("g_win");msg=`<span class="g">${tr("r_win",cn(t),money(t.price))}</span>`}
  else if(out==="gold"){const s=STH[Math.floor(Math.random()*STH.length)];S.inv.push(mk(s.id));S.st.wins++;S.st.gold++;S.xp+=150;S.st.prem++;got=s;title=tr("g_gold");msg=`<span class="gold">${tr("r_gold",cn(s),money(s.price))}</span>`}
  else msg=`<span class="r">${tr("r_lose",names)}</span>`;
  sel=[];save();
  setTimeout(()=>{spinning=false;$("res").innerHTML=msg;nextGold();
    const w=$("wheel");w.style.transition="none";rot=0;w.style.transform="rotate(0deg)";void w.offsetWidth;w.style.transition="";
    render();if(got)showGot([got],title)},4400);
};
// таймеры чёрного рынка: обновляем цифры, а полный экран перерисовываем, только когда что-то стало готово
setInterval(()=>{
  document.querySelectorAll("[data-tm]").forEach(e=>{const d=S.dep[+e.dataset.tm];if(d)e.textContent=fmtT(Math.max(0,DEP_MS-(Date.now()-d.t0)))});
  const r=S.dep.filter(readyD).length;
  if(r!==lastReady&&!spinning&&!boxBusy&&!$("got").classList.contains("on")&&!$("pick").classList.contains("on"))render();else setBadge()},1000);

S=load()||fresh();if(!S.shop.length)genShop();
applyTheme();applyLang();
try{const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand()}}catch(e){}
nextGold();render();
</script>
</body>
